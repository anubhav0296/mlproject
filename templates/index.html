<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Student Exam Performance</title>
  <style>
    :root{
      --bg:#f6f8fb;--card:#fff;--accent:#2563eb;--muted:#6b7280;
      --glass: rgba(255,255,255,0.7);
      --radius:12px;
      font-family:Inter,system-ui,Segoe UI,Roboto,Arial;
    }
    html,body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg),#fff)}
    .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:36px}
    .card{width:100%;max-width:840px;background:var(--card);border-radius:var(--radius);box-shadow:0 8px 30px rgba(2,6,23,0.08);padding:28px;display:flex;gap:24px;align-items:center}
    .brand{flex:1}
    .logo{width:64px;height:64px;border-radius:12px;background:linear-gradient(135deg,#2563eb,#06b6d4);display:grid;place-items:center;color:white;font-weight:700;font-size:20px}
    h1{margin:0 0 8px 0;font-size:22px}
    p{margin:0;color:var(--muted)}
    .cta{display:flex;gap:12px;margin-top:18px}
    .btn{padding:10px 16px;border-radius:10px;border:0;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
    .btn-primary{background:var(--accent);color:white}
    .btn-outline{background:transparent;border:1px solid #e6eefc;color:var(--accent)}
    .meta{font-size:13px;color:var(--muted);margin-top:8px}
    @media (max-width:720px){.card{flex-direction:column;align-items:stretch;text-align:center}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="logo">SP</div>
      <div class="brand">
        <h1>Student Exam Performance Predictor</h1>
        <p>Upload data or run a single-student prediction to get expected scores and intervention suggestions.</p>
        <div class="cta">
          <!-- direct link to your prediction page -->
          <a class="btn btn-primary" href="/predictdata">Predict now</a>

          <!-- OR use a GET form (either works) -->
          <!--
          <form action="/predictdata" method="get" style="display:inline">
            <button class="btn btn-outline" type="submit">Go to prediction page</button>
          </form>
          -->
        </div>
        <div class="meta">Tip: your prediction page is served at <code>/predictdata</code></div>
      </div>
    </div>
  </div>
</body>
</html>
