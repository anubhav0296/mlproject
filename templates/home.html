<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Predict Student Maths Score</title>
  <style>
    :root{--bg:#f7f9fc;--card:#fff;--accent:#0ea5a4;--muted:#6b7280;--radius:10px}
    body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial;background:var(--bg);color:#0f172a}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
    .card{width:100%;max-width:720px;background:var(--card);border-radius:var(--radius);box-shadow:0 8px 30px rgba(2,6,23,0.06);padding:22px}
    h1{margin:0 0 6px 0;font-size:20px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
    @media (max-width:720px){.grid{grid-template-columns:1fr}}
    label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
    select,input[type=number]{width:100%;padding:10px;border-radius:8px;border:1px solid #e6eef8;background:#fbfeff}
    .actions{display:flex;gap:8px;margin-top:14px}
    .btn{padding:10px 12px;border-radius:8px;border:0;cursor:pointer;font-weight:700}
    .btn-primary{background:var(--accent);color:white}
    .muted{color:var(--muted);font-size:13px;margin-top:12px}
    .result{margin-top:16px;padding:12px;border-radius:8px;background:#f0fdf4;border:1px solid #dcfce7}
    .footer{margin-top:18px;font-size:13px;color:var(--muted)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Student Exam Performance Predictor</h1>
      <p class="muted">Fill the form below and click <strong>Predict your Maths Score</strong>.</p>

      <form action="{{ url_for('predict_datapoint') }}" method="post">
        <div class="grid">
          <div>
            <label>Gender</label>
            <select name="gender" required>
              <option selected disabled value="">Select gender</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
            </select>
          </div>

          <div>
            <label>Race / Ethnicity</label>
            <select name="ethnicity" required>
              <option selected disabled value="">Select ethnicity</option>
              <option value="group A">Group A</option>
              <option value="group B">Group B</option>
              <option value="group C">Group C</option>
              <option value="group D">Group D</option>
              <option value="group E">Group E</option>
            </select>
          </div>

          <div>
            <label>Parental level of education</label>
            <select name="parental_level_of_education" required>
              <option selected disabled value="">Select</option>
              <option value="associate's degree">associate's degree</option>
              <option value="bachelor's degree">bachelor's degree</option>
              <option value="high school">high school</option>
              <option value="master's degree">master's degree</option>
              <option value="some college">some college</option>
              <option value="some high school">some high school</option>
            </select>
          </div>

          <div>
            <label>Lunch type</label>
            <select name="lunch" required>
              <option selected disabled value="">Select lunch</option>
              <option value="free/reduced">free/reduced</option>
              <option value="standard">standard</option>
            </select>
          </div>

          <div>
            <label>Test preparation course</label>
            <select name="test_preparation_course" required>
              <option selected disabled value="">Select</option>
              <option value="none">none</option>
              <option value="completed">completed</option>
            </select>
          </div>

          <!-- NOTE: fixed the labels vs names (reading_score / writing_score) -->
          <div>
            <label>Reading score (out of 100)</label>
            <input type="number" name="reading_score" min="0" max="100" required />
          </div>

          <div>
            <label>Writing score (out of 100)</label>
            <input type="number" name="writing_score" min="0" max="100" required />
          </div>
        </div>

        <div class="actions">
          <button class="btn btn-primary" type="submit">Predict your Maths Score</button>
          <a class="btn" href="/" style="background:#eef2ff;color:#1e3a8a;border-radius:8px;padding:10px 12px;text-decoration:none">Back to home</a>
        </div>
      </form>

      {% if results is defined %}
      <div class="result">
        <strong>Prediction result:</strong>
        <div style="margin-top:8px">Predicted Maths Score: <strong>{{ results }}</strong></div>
      </div>
      {% endif %}

      <div class="footer">Powered by your ML model — ensure server-side validation before using in production.</div>
    </div>
  </div>
</body>
</html>
